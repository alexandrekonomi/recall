spring:
  application:
    name: clinica-reativacao
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:no-reply@envio.clubetenis.com.br}
  from-name: Recall

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: 8080